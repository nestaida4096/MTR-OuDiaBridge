name: MTR4 Architectury Build

on:
  push:
    paths:
      - "common/**"
      - "fabric/**"
      - "forge/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/mtr4-build.yml"
  pull_request:
    paths:
      - "common/**"
      - "fabric/**"
      - "forge/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/mtr4-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric and Forge
        run: bash ./gradlew build --no-daemon
